[package]
name = "mhgu-sdk-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
mhgu-sdk = { path = "../../crates/mhgu-sdk" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(all(target_arch = "arm", target_endian = "little"))'.dependencies]
mhfz-sdk = { path = "../../crates/mhfz-sdk" }
mhgu-forge = "1.5.0"
