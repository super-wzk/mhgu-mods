[package]
name = "style-registry"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
ini_core = "0.2"
mhgu-sdk = { path = "../../crates/mhgu-sdk" }

[target.'cfg(all(target_arch = "arm", target_endian = "little"))'.dependencies]
mhfz-sdk = { path = "../../crates/mhfz-sdk" }
mhgu-forge = { version = "1.5.0", features = ["config"] }
